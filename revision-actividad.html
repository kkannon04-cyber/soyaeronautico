<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Revisar mi entrega &middot; SoyAeron&aacute;utico</title>
  <link rel="icon" type="image/svg+xml" href="ASSETS/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>

    /* Mismo sistema visual que los quizzes del portal (quiz-ats.html) */
    :root {
      --bg: #FFFFFF;
      --panel: #F5F8FC;
      --panel-alt: #EAF1FB;
      --accent: #1657C6;
      --accent-rgb: 22,87,198;
      --text: #0F1B2D;
      --text-muted: #5B6B7F;
      --hairline: #E1E7EF;
      --danger: #D64545;
      --vfr: #2E9E6D;
      --mvfr: #3E7BFA;
      --topbar-bg: rgba(255,255,255,0.85);
      --shadow-card: 0 12px 30px -18px rgba(15,23,42,0.18);
    }
    [data-theme="dark"] {
      --bg: #0B1220;
      --panel: #121C2E;
      --panel-alt: #17223A;
      --accent: #4F8EF7;
      --accent-rgb: 79,142,247;
      --text: #EDEFF3;
      --text-muted: #8894A8;
      --hairline: #2A3548;
      --danger: #C9564F;
      --vfr: #4FA88C;
      --mvfr: #4A8FD1;
      --topbar-bg: rgba(11,18,32,0.85);
      --shadow-card: 0 12px 30px -18px rgba(0,0,0,0.55);
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
    h1,h2,h3,h4 { font-family:'Archivo', sans-serif; margin:0; }
    a { color:inherit; text-decoration:none; }
    .mono { font-family:'IBM Plex Mono', monospace; }

    .topbar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:var(--topbar-bg); backdrop-filter:blur(8px); border-bottom:1px solid var(--hairline); gap:14px; }
    .brand { display:flex; align-items:center; gap:10px; font-family:'Archivo', sans-serif; font-weight:800; font-size:1.05rem; color:var(--text); }
    .brand-mark { width:34px; height:34px; display:flex; align-items:center; justify-content:center; color:var(--accent); flex-shrink:0; }
    .brand-mark svg { display:block; }
    .btn-volver-panel { display:inline-block; background:none; color:var(--accent); border:1px solid var(--accent); padding:8px 18px; border-radius:30px; font-weight:600; font-size:0.82rem; white-space:nowrap; }
    .btn-volver-panel:hover { background:rgba(var(--accent-rgb),0.08); }

    .contenedor { max-width:900px; margin:0 auto; padding:36px 32px 60px; }
    .eyebrow { font-family:'IBM Plex Mono'; font-size:0.75rem; letter-spacing:0.18em; color:var(--vfr); text-transform:uppercase; margin-bottom:12px; }
    h1.titulo { font-size:clamp(1.5rem, 3.4vw, 2.1rem); line-height:1.25; margin-bottom:10px; }
    .meta-actividad { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
    .meta-chip { font-family:'IBM Plex Mono'; font-size:0.72rem; color:var(--text-muted); background:var(--panel); border:1px solid var(--hairline); padding:5px 12px; border-radius:20px; }
    .meta-chip.alerta { color:#b45309; border-color:#f59e0b; background:rgba(245,158,11,0.1); }
    .instrucciones { display:flex; gap:10px; align-items:flex-start; background:var(--panel); border:1px solid var(--hairline); border-left:3px solid var(--vfr); border-radius:10px; padding:14px 18px; margin-bottom:26px; font-size:0.9rem; color:var(--text-muted); line-height:1.6; }
    .instrucciones b { color:var(--text); }

    /* Modo seguro de examen: aviso de cambio de pestaña y de borrador recuperado */
    .aviso-seguridad { display:none; gap:10px; align-items:flex-start; background:rgba(245,158,11,0.1); border:1px solid #f59e0b; border-radius:10px; padding:12px 16px; margin-bottom:18px; font-size:0.86rem; color:#b45309; line-height:1.5; }
    [data-theme="dark"] .aviso-seguridad { color:#fbbf24; }
    .aviso-borrador { display:none; gap:10px; align-items:flex-start; background:rgba(var(--accent-rgb),0.08); border:1px solid var(--accent); border-radius:10px; padding:12px 16px; margin-bottom:18px; font-size:0.86rem; color:var(--text-muted); line-height:1.5; }
    .aviso-borrador b { color:var(--text); }

    .lectura { background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:26px; margin-bottom:22px; font-size:0.97rem; line-height:1.75; white-space:pre-wrap; }
    .lectura-acciones { text-align:center; margin-bottom:30px; }

    .question-card { background:var(--panel); border:1px solid var(--hairline); border-radius:14px; padding:24px 26px; margin-bottom:22px; }
    .question-card.correct { border-left:6px solid var(--vfr); }
    .question-card.wrong { border-left:6px solid var(--danger); }
    .q-header { display:flex; align-items:baseline; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .q-num { font-family:'IBM Plex Mono'; font-weight:600; color:var(--accent); font-size:0.85rem; background:var(--bg); padding:2px 12px; border-radius:12px; border:1px solid var(--hairline); }
    .q-text { font-weight:500; font-size:1rem; margin-bottom:14px; line-height:1.5; }
    .options { display:flex; flex-direction:column; gap:8px; }
    .opt-btn { background:var(--bg); border:1px solid var(--hairline); border-radius:8px; padding:13px 16px; font-size:0.9rem; text-align:left; cursor:pointer; color:var(--text); font-family:'IBM Plex Sans'; transition:border-color .15s, background .15s; }
    .opt-btn:hover:not(:disabled) { border-color:var(--accent); background:var(--panel-alt); }
    .opt-btn.elegida { border-color:var(--accent); background:rgba(var(--accent-rgb),0.10); font-weight:600; }
    .opt-btn.selected-correct { border-color:var(--vfr); background:rgba(46,158,109,0.14); font-weight:600; }
    .opt-btn.selected-wrong { border-color:var(--danger); background:rgba(214,69,69,0.12); font-weight:600; }
    .opt-btn.reveal-correct { border-color:var(--vfr); background:rgba(46,158,109,0.08); }
    .opt-btn:disabled { cursor:default; }

    .barra-entrega { position:sticky; bottom:0; background:var(--topbar-bg); backdrop-filter:blur(8px); border-top:1px solid var(--hairline); padding:16px 32px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .btn-entregar { background:var(--accent); color:#fff; border:none; padding:11px 26px; border-radius:30px; font-weight:700; font-size:0.9rem; cursor:pointer; font-family:'IBM Plex Sans'; }
    .btn-entregar:hover:not(:disabled) { filter:brightness(1.08); }
    .btn-entregar:disabled { opacity:0.55; cursor:not-allowed; }
    .btn-secundario { background:none; border:1px solid var(--hairline); color:var(--text); padding:10px 20px; border-radius:30px; font-weight:600; font-size:0.85rem; cursor:pointer; font-family:'IBM Plex Sans'; }

    .resultado { max-width:900px; margin:0 auto; padding:0 32px; }
    .resultado-card { border:1px solid var(--hairline); border-left:5px solid var(--vfr); border-radius:14px; padding:24px 26px; background:var(--panel); margin-bottom:26px; }
    .resultado-card.tier-bien { border-left-color:var(--mvfr); }
    .resultado-card.tier-reforzar { border-left-color:#d97706; }
    .resultado-nota { font-family:'IBM Plex Mono'; font-size:2rem; font-weight:700; color:var(--vfr); }
    .resultado-card.tier-bien .resultado-nota { color:var(--mvfr); }
    .resultado-card.tier-reforzar .resultado-nota { color:#d97706; }
    .resultado-card p { margin:10px 0 0; font-size:0.92rem; line-height:1.6; color:var(--text-muted); }
    .resultado-acciones { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }

    .aviso-bloqueo { max-width:640px; margin:60px auto; padding:30px; text-align:center; background:var(--panel); border:1px solid var(--hairline); border-radius:14px; }
    .aviso-bloqueo h2 { font-size:1.2rem; margin-bottom:10px; }
    .aviso-bloqueo p { color:var(--text-muted); font-size:0.92rem; line-height:1.6; margin-bottom:18px; }

    .cargando { text-align:center; padding:70px 20px; color:var(--text-muted); font-size:0.92rem; }

    @media (max-width:600px) {
      .topbar { padding:12px 16px; }
      .contenedor, .resultado { padding-left:16px; padding-right:16px; }
      .question-card { padding:18px; }
      .barra-entrega { padding:12px 16px; }
    }

    .credito-autor { border-top:1px solid rgba(128,128,128,0.22); margin-top:40px; padding:20px 24px; text-align:center; font-size:0.78rem; color:var(--text-muted); }
    .credito-autor strong { color:inherit; font-weight:600; }

    /* Revision: solo lectura */
    .opt-btn.marcada-correcta { border-color: var(--vfr); background: rgba(46,158,109,0.12); }
    .opt-btn.marcada-elegida  { border-color: var(--danger); background: rgba(214,69,69,0.10); }
    .opt-btn.oculta-correcta  { opacity: 0.55; }
    .chip-estado { display:inline-block; font-size:0.72rem; font-weight:600; padding:3px 9px;
                   border-radius:20px; margin-left:8px; font-family:'IBM Plex Mono', monospace; }
    .chip-ok   { background: rgba(46,158,109,0.15); color: var(--vfr); }
    .chip-mal  { background: rgba(214,69,69,0.13); color: var(--danger); }
    .chip-corr { background: rgba(var(--accent-rgb),0.13); color: var(--accent); }
    .comentario-profesor { background: var(--panel-alt); border-left: 3px solid var(--accent);
                           border-radius: 10px; padding: 14px 16px; margin: 18px 0; font-size: 0.92rem; }
    .comentario-profesor h3 { font-size: 0.95rem; margin-bottom: 6px; }
    .comentario-profesor .fecha { color: var(--text-muted); font-size: 0.78rem; }
    .nota-oculta { background: var(--panel); border: 1px dashed var(--hairline); border-radius: 10px;
                   padding: 14px 16px; margin: 18px 0; color: var(--text-muted); font-size: 0.9rem; }

  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4"></script>
  <script src="supabase-config.js"></script>
  <script src="modulos.js"></script>
  <script src="progreso.js"></script>
</head>
<body>
<script src="auth-gate.js"></script>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="Ir al inicio — SoyAeronáutico">
    <div class="brand-mark">
      <svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M20 6 L25.5 20 L14.5 20 Z" fill="currentColor"/>
        <path d="M20 34 L25.5 20 L14.5 20 Z" fill="currentColor" opacity="0.4"/>
        <circle cx="20" cy="20" r="2.6" fill="var(--bg)" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </div>
    <div>SoyAeronáutico</div>
  </a>
  <a href="Panel_estudiante.html" class="btn-volver-panel">Volver a mi panel</a>
</header>

<div id="cargando" class="cargando">Cargando tu entrega&hellip;</div>

<div id="contenido" style="display:none;">
  <div class="contenedor">
    <div class="eyebrow">Mi entrega</div>
    <h1 class="titulo" id="tituloActividad"></h1>
    <div class="meta-actividad" id="metaActividad"></div>

    <div id="zonaComentarios"></div>
    <div id="zonaPreguntas"></div>
  </div>
</div>

<div id="bloqueo" class="aviso-bloqueo" style="display:none;">
  <h2 id="bloqueoTitulo"></h2>
  <p id="bloqueoTexto"></p>
  <a href="Panel_estudiante.html" class="btn-volver-panel">Volver a mi panel</a>
</div>

<div class="credito-autor">Creado por <strong>Cristian Arcila</strong> &middot; &copy; 2026 &mdash; Todos los derechos reservados</div>

<script>
  // Tema, coherente con el resto del sitio
  if (localStorage.getItem('aisTheme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

  // NOTA DE DISEÑO: esta página NO registra incidentes ni avisa al salir.
  // Es solo lectura; el antitrampa de tomar-actividad.html aquí produciría
  // falsos positivos contra un estudiante que únicamente revisa su nota.

  const params = new URLSearchParams(location.search);
  const RESULTADO_ID = params.get('resultado');

  function esc(t) {
    return String(t === null || t === undefined ? '' : t)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function fechaLegible(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleDateString('es-CO', {
        day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
      });
    } catch (e) { return iso; }
  }

  function bloquear(titulo, texto) {
    document.getElementById('cargando').style.display = 'none';
    document.getElementById('contenido').style.display = 'none';
    const b = document.getElementById('bloqueo');
    document.getElementById('bloqueoTitulo').textContent = titulo;
    document.getElementById('bloqueoTexto').textContent = texto;
    b.style.display = '';
  }

  function claseNota(p) {
    if (p >= 90) return 'chip-ok';
    if (p >= 70) return 'chip-corr';
    return 'chip-mal';
  }

  function pintarComentarios(r) {
    const zona = document.getElementById('zonaComentarios');
    const correcciones = Array.isArray(r.correcciones) ? r.correcciones : [];
    // Sólo tienen valor para el estudiante las que traen un texto escrito o
    // las que movieron la nota.
    const utiles = correcciones.filter(c => c.motivo || c.correctas_antes !== c.correctas_despues);
    if (utiles.length === 0) { zona.innerHTML = ''; return; }

    zona.innerHTML = utiles.map(c => `
      <div class="comentario-profesor">
        <h3>Comentario de tu profesor</h3>
        <div class="fecha">${esc(fechaLegible(c.fecha))}</div>
        ${c.motivo ? `<p>${esc(c.motivo)}</p>` : ''}
        ${c.correctas_antes !== c.correctas_despues
          ? `<p class="mono">Nota ajustada: ${c.correctas_antes}/${r.total} &rarr; <b>${c.correctas_despues}/${r.total}</b> (${c.porcentaje_despues}%)</p>`
          : ''}
      </div>`).join('');
  }

  function pintarPreguntas(r) {
    const zona = document.getElementById('zonaPreguntas');
    const preguntas = Array.isArray(r.preguntas) ? r.preguntas : [];

    if (preguntas.length === 0) {
      zona.innerHTML = '<div class="nota-oculta">Esta entrega no guarda el detalle de las respuestas.</div>';
      return;
    }

    // Mientras la actividad siga abierta el servidor no envía la respuesta
    // correcta, para que la revisión no sea la chuleta del siguiente intento.
    const aviso = r.actividad_cerrada ? '' :
      '<div class="nota-oculta">Todavía puedes volver a presentar esta actividad, así que por ahora solo ves en qué preguntas acertaste y en cuáles no. Las respuestas correctas aparecen aquí cuando la actividad se cierre.</div>';

    zona.innerHTML = aviso + preguntas.map((q, idx) => {
      const opciones = Array.isArray(q.opciones) ? q.opciones : [];
      const chips = (q.ok ? '<span class="chip-estado chip-ok">Correcta</span>'
                          : '<span class="chip-estado chip-mal">Incorrecta</span>')
                  + (q.corregida ? '<span class="chip-estado chip-corr">Corregida por tu profesor</span>' : '');

      return `
        <div class="question-card">
          <div class="q-header">
            <span class="q-num">${idx + 1}</span>
            <div class="q-text">${esc(q.enunciado || '(esta pregunta ya no está en el banco)')}${chips}</div>
          </div>
          <div class="options">
            ${opciones.map((op, i) => {
              const esElegida = (q.elegida === i);
              const esCorrecta = (q.correcta !== null && q.correcta === i);
              let clase = 'opt-btn';
              if (esCorrecta) clase += ' marcada-correcta';
              else if (esElegida && !q.ok) clase += ' marcada-elegida';
              if (q.correcta === null && !esElegida) clase += ' oculta-correcta';
              const etiqueta = esElegida ? ' <b>&larr; tu respuesta</b>' : '';
              return `<div class="${clase}">${esc(op)}${etiqueta}</div>`;
            }).join('')}
          </div>
        </div>`;
    }).join('');
  }

  (async function inicio() {
    if (!RESULTADO_ID) {
      bloquear('Falta la entrega', 'No sabemos qué entrega quieres revisar. Vuelve a tu panel y ábrela desde allí.');
      return;
    }

    const sesion = await obtenerSesionActual();
    if (!sesion) {
      bloquear('Inicia sesión', 'Necesitas iniciar sesión para revisar tu entrega.');
      return;
    }

    const cliente = obtenerClienteAuth();
    const { data, error } = await cliente.rpc('obtener_resultado_examen', { p_resultado_id: RESULTADO_ID });
    if (error) {
      bloquear('No pudimos abrir tu entrega', error.message);
      return;
    }

    const r = data;
    document.getElementById('tituloActividad').textContent = r.actividad_titulo || 'Actividad';
    document.getElementById('metaActividad').innerHTML =
      `<span class="meta-chip">${r.tipo === 'texto' ? 'Lectura' : 'Examen'}</span>` +
      `<span class="meta-chip mono">${r.correctas}/${r.total} &middot; ${r.porcentaje}%</span>` +
      `<span class="meta-chip">Entregada el ${esc(fechaLegible(r.fecha))}</span>` +
      (r.actividad_cerrada ? '<span class="meta-chip">Actividad cerrada</span>' : '');

    pintarComentarios(r);
    pintarPreguntas(r);

    document.getElementById('cargando').style.display = 'none';
    document.getElementById('contenido').style.display = '';
  })();
</script>
</body>
</html>
